name: Generate QR Codes

on:
  push:
    branches:
      - prod
    paths:
      - "site/_data/urls.json"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code on prod branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo clone $GITHUB_REPOSITORY --branch prod -- --depth=1
      - name: Generate QR Codes
        run: .github/actions/qrcode.sh
      - run: git add -A && git commit -m "Generated new QR Codes"
      - name: Push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push
