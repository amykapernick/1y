name: Generate QR Codes & Build Site

on:
  push:
    branches:
      - prod

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Generate QR Codes
        run: .github/actions/qrcode.sh
      - name: Set up git
        continue-on-error: true
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
      - run: git add -A && git commit -m "Generated new QR Codes"
        continue-on-error: true
      - name: Push changes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push
      - name: Add Issues from Comments
        uses: "alstr/todo-to-issue-action@v4"
        with:
          AUTO_ASSIGN: true
          CLOSE_ISSUES: true
      - name: Deploy to Netlify
        id: build_site
        env:
          TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          SITE_ID: ${{ secrets.SITE_ID }}
        run: ./.github/actions/netlify.sh --p true
